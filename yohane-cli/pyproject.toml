[project]
name = "yohane-cli"
dynamic = ["version"]
description = "Typer CLI for yohane"
license = "MIT"
authors = [{ name = "NextFire", email = "git@yuru.moe" }]
requires-python = ">=3.11"
dependencies = ["click==8.5.1", "typer==0.29.1", "yt-dlp[default]==2026.10.26"]

[project.urls]
homepage = "https://github.com/Japan7/yohane"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }
